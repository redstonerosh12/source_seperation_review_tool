<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stem Review</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237c9cff'/><path d='M7 18v-4M11 22V10M15 20v-8M19 25V7M23 19v-6' stroke='white' stroke-width='2.4' stroke-linecap='round'/></svg>">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32"><path d="M7 18v-4M11 22V10M15 20v-8M19 25V7M23 19v-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </span>
      Stem Review
    </a>
    <button class="btn ghost" id="importBtn" title="Merge reviews from a CSV (song_id, comment, verdict)">Import CSV</button>
    <input type="file" id="importFile" accept=".csv,text/csv" hidden>
    <div class="progress" id="progress" title="Reviewed songs"></div>
    <a class="btn ghost" href="/reviews.csv" download>Export CSV</a>
  </header>
  <main id="app"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
